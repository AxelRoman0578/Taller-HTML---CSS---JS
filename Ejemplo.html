<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaliza tu tarjeta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #tarjeta {
            background-color: #f0f0f0;
            color: #333333;
            width: 320px;
            margin: 20px auto;
            padding: 40px 20px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Personaliza tu tarjeta</h1>
    <div id="tarjeta">
        <p>Bienvenido a mi aplicación web</p>
    </div>
    <div>
        <button id="btn-azul" type="button">Azul</button>
        <button id="btn-verde" type="button">Verde</button>
        <button id="btn-rojo" type="button">Rojo</button>
        <button id="btn-restablecer" type="button">Restablecer</button>
    </div>
    <script src="jss/app.js"></script>
</body>
</html>
